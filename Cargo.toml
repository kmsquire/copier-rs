[package]
name = "copier-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A Rust port of Copier, the project templating tool"
license = "MIT"
default-run = "copier"

[lib]
name = "copier"
path = "src/lib.rs"

[[bin]]
name = "copier"
path = "src/main.rs"

[dependencies]
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
indoc = "2"
regex = "1"
rstest = "0.26"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
