[package]
name = "copier-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A Rust port of Copier, the project templating tool"
license = "MIT"
default-run = "copier"

[lib]
name = "copier"
path = "src/lib.rs"

[[bin]]
name = "copier"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
md-5 = "0.10"
minijinja = { version = "3.1", features = ["loop_controls", "preserve_order", "urlencode"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
sha1 = "0.10"
uuid = { version = "1", features = ["v5"] }
indexmap = "2"
pep440_rs = "0.7"
regex = "1"
saphyr-parser = "0.3"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
thiserror = "2"

[dev-dependencies]
indoc = "2"
rstest = "0.26"

[lints.rust]
unsafe_code = "forbid"
